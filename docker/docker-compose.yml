services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      # Bind-mounts the existing native install's model store directly (see
      # OLLAMA_MODELS in the Setup section) instead of re-pulling ~37GB --
      # Ollama's blob format is identical across platforms, so this just
      # works. F:\ollama-models IS the models directory itself (contains
      # blobs/ and manifests/ directly), so it maps to .ollama/models
      # inside the container, not .ollama itself.
      - F:/ollama-models:/root/.ollama/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    restart: always

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng-config:/etc/searxng
    restart: always

volumes:
  open-webui:
